<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="{{ url_for('static', path='/css/styles.css') }}"
          type="text/css" rel="stylesheet">

    {% from 'macros.html' import load_header, load_footer %}
    <title>SkinCare® Forum - Register</title>
</head>
<body>
    {{ load_header(current_user, csrf_token) }}

    <main>
        <h1>Register</h1>
        <p class="page-description">Join our community and share your skincare experience.</p>

        <div class="grid-form-container">

            {% if error %}
                <p class="error">{{ error }}</p>
            {% endif %}

            <form action="/register" method="post">
                <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                <div class="grid-container-lr">

                    <fieldset>
                        <label for="first_name">First Name</label>
                        <input id="first_name" name="first_name" type="text"
                               placeholder="First name" minlength="2"
                               maxlength="32" required>
                    </fieldset>

                    <fieldset>
                        <label for="last_name">Last Name</label>
                        <input id="last_name" name="last_name" type="text"
                               placeholder="Last name" minlength="2"
                               maxlength="32" required>
                    </fieldset>

                    <fieldset>
                        <label for="email">Email</label>
                        <input id="email" name="email" type="email"
                               placeholder="Email" required>
                    </fieldset>

                    <fieldset>
                        <label for="username">Username</label>
                        <input id="username" name="username" type="text"
                               placeholder="Username" minlength="2"
                               maxlength="16" required>
                    </fieldset>

                    <fieldset>
                        <label for="password">Password</label>
                        <input id="password" name="password" type="password"
                               placeholder="Password" minlength="8"
                               maxlength="128" required>
                    </fieldset>

                    <fieldset>
                        <button type="submit">Register</button>
                    </fieldset>

                </div>
            </form>

        </div>
    </main>

    {{ load_footer() }}
</body>
</html>
